url: https://max578.github.io/funcrop/

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/max578/funcrop

reference:
  - title: "B-Spline Basis Construction"
    desc: "Functions for constructing B-spline bases, penalties, and design matrices"
    contents:
      - bspline_basis
      - tensor_bspline_basis
      - make_Zspline
      - make_penalty

  - title: "Data Structures"
    desc: "S3 classes for functional data objects"
    contents:
      - fda_basis
      - fda_data
      - fda_model

  - title: "Model Fitting"
    desc: "Core model fitting functions for FDA in crop trials"
    contents:
      - fit_functional_profiles
      - scalar_on_function
      - fit_fda_joint
      - fit_2d_functional
      - scalar_on_2d_function
      - fit_fda_met

  - title: "Prediction & Inference"
    desc: "Prediction, comparison, and inference tools"
    contents:
      - starts_with("predict")
      - compare_methods
      - posterior_draws

  - title: "Visualisation"
    desc: "Publication-ready plots for FDA results"
    contents:
      - plot_functional_profiles
      - plot_coefficient_function
      - plot_gxe_heatmap
      - plot_fa_biplot
      - plot_backend_comparison

  - title: "Backend Management"
    desc: "Engine selection and backend utilities"
    contents:
      - funcrop_engines
      - funcrop_default_engine

  - title: "Datasets"
    desc: "Example datasets for tutorials and testing"
    contents:
      - sim_grain_fill
      - sim_met_fda

articles:
  - title: "Getting Started"
    contents:
      - introduction
  - title: "Background"
    contents:
      - literature-review
  - title: "Case Studies"
    contents:
      - grain-fill
      - stay-green
      - 2d-functional
      - met-fda
      - genomic-fda
  - title: "Advanced Topics"
    contents:
      - bayesian-fda
      - asreml-vs-bayesreml
